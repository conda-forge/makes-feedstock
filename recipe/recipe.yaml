context:
  version: "4.0.0"

package:
  name: makes
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/makes/-/makes-${{ version }}.tgz
  sha256: 45add35d0a60e1bcd5d43b84fc9ff69f73c860822e73f573093eb5d36a8b6f9a

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - makes --help

about:
  license: MIT
  license_file: LICENSE
  summary: A tool to scaffold new projects, simple enough that you would want to define your own skeletons (aka generators).
  homepage: https://github.com/makesjs/makes
  repository: https://github.com/makesjs/makes

extra:
  recipe-maintainers:
    - danielnachun
